[project]
name = "ai-petcare-assistant"
version = "0.1.0"
description = "Petco Summer Hackathon - AI PetCare Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "crewai",
    "crewai-tools",
    "sqlalchemy>=2.0.31",
    "redis>=5.0.7",
    "openai>=1.35.14",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.4.2",
    "faiss-cpu>=1.8.0",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]